name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Installa pacchetti e dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Esegui Test (pytest)
        run: pytest -q tests
