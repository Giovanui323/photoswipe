name: Cleanup Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Rinomina Release 1.5.9 e rimuovi release di debug
        run: |
          # Imposta il nome pulito "PhotoSwipe 1.5.9"
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Giovanui323/photoswipe/releases/429074823 \
            -d '{"name":"PhotoSwipe 1.5.9"}'
